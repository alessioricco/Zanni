# A local seat (D36): the director starts it with --play pointed at itself, and the join token in its environment.
# Model names are examples: a local model with tool calling first, a cloud model second; both priced (D39).
name: coder-2
role: ../../roles/slug-coder
play: ./play.yaml
models:
  - provider: ollama
    model: qwen3.8:27b
    base_url: ${OLLAMA_BASE_URL}
    price: { input: 0, output: 0 }
  - provider: anthropic
    model: claude-haiku-5-5
credentials:
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
