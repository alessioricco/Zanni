# A rehearsal: the architect reviews a backlog, then writes the design. An actor configuration's `play` points here.
rehearsal: smoke
description: The architect reviews round 1's backlog, then writes spec/architecture/overview.md.
stage: ./smoke-stage
cues:
  - scene: Backlog review
    instructions: >-
      Review backlog/round-1.md from the architect's point of view, and write your review to
      reviews/round-1/backlog-architect.md.
    reads: [vision.md, backlog/round-1.md]
    writes: [reviews/round-1/backlog-architect.md]
    verifiers: [the review exists]
  - scene: Specify
    instructions: >-
      Write spec/architecture/overview.md for round 1: the modules under app/, their contracts, and the commands to
      run the tests and start the app.
    reads: [vision.md, backlog/round-1.md, pyproject.toml]
    writes: [spec/architecture/overview.md]
    verifiers: [the design names its modules and commands]
verify:
  - name: review-written
    command: [test, -s, reviews/round-1/backlog-architect.md]
  - name: design-written
    command: [grep, -q, "app/", spec/architecture/overview.md]
